<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carbon Architecture documentation">
  <title>Carbon Architecture Docs</title>
  <!-- Theme: Simple -->
   <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/buble.css" /> -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/LIGMATV/docsify-theme-github/github.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prism-themes/themes/prism-ghcolors.css">
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css"> -->
  <style>
    html[data-authenticated="false"] #app {
      display: none;
    }

    .access-gate {
      align-items: center;
      background: #f7f8fb;
      color: #172033;
      display: flex;
      inset: 0;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: fixed;
      z-index: 9999;
    }

    .access-gate[hidden] {
      display: none;
    }

    .access-panel {
      background: #fff;
      border: 1px solid #d9deea;
      border-radius: 8px;
      box-shadow: 0 18px 60px rgb(23 32 51 / 12%);
      max-width: 360px;
      padding: 28px;
      width: 100%;
    }

    .access-panel h1 {
      font-size: 22px;
      font-weight: 650;
      margin: 0 0 8px;
    }

    .access-panel p {
      color: #586174;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 20px;
    }

    .access-field {
      display: grid;
      gap: 8px;
    }

    .access-field label {
      color: #364154;
      font-size: 13px;
      font-weight: 600;
    }

    .access-field input {
      border: 1px solid #c7cedd;
      border-radius: 6px;
      font: inherit;
      padding: 10px 12px;
    }

    .access-field input:focus {
      border-color: #4f6bed;
      box-shadow: 0 0 0 3px rgb(79 107 237 / 16%);
      outline: none;
    }

    .access-submit {
      background: #172033;
      border: 0;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      margin-top: 16px;
      padding: 10px 14px;
      width: 100%;
    }

    .access-submit:hover {
      background: #26324a;
    }

    .access-error {
      color: #b42318;
      font-size: 13px;
      min-height: 20px;
      margin-top: 10px;
    }

    .markdown-section pre,
    .markdown-section pre[data-lang] {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      color: #24292f;
    }

    .markdown-section pre > code,
    .markdown-section pre[data-lang] > code {
      background: transparent;
      color: #24292f;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      text-shadow: none;
    }

    .markdown-section code {
      background: rgb(175 184 193 / 20%);
      border-radius: 6px;
      color: #24292f;
    }

    .markdown-section pre code {
      background: transparent;
    }

    .markdown-section .token.comment,
    .markdown-section .token.prolog,
    .markdown-section .token.doctype,
    .markdown-section .token.cdata {
      color: #6a737d;
    }

    .markdown-section .token.punctuation {
      color: #24292f;
    }

    .markdown-section .token.property,
    .markdown-section .token.tag,
    .markdown-section .token.boolean,
    .markdown-section .token.number,
    .markdown-section .token.constant,
    .markdown-section .token.symbol,
    .markdown-section .token.deleted {
      color: #005cc5;
    }

    .markdown-section .token.selector,
    .markdown-section .token.attr-name,
    .markdown-section .token.string,
    .markdown-section .token.char,
    .markdown-section .token.builtin,
    .markdown-section .token.inserted {
      color: #032f62;
    }

    .markdown-section .token.operator,
    .markdown-section .token.entity,
    .markdown-section .token.url {
      color: #d73a49;
    }

    .markdown-section .token.atrule,
    .markdown-section .token.attr-value,
    .markdown-section .token.keyword {
      color: #d73a49;
    }

    .markdown-section .token.function,
    .markdown-section .token.class-name {
      color: #6f42c1;
    }

    .markdown-section .token.regex,
    .markdown-section .token.important,
    .markdown-section .token.variable {
      color: #e36209;
    }

    .markdown-section .mermaid {
      background: #fff;
      border: 1px solid #d9d9e3;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgb(32 33 35 / 4%);
      margin: 1.2em 0;
      overflow-x: auto;
      padding: 16px;
      text-align: center;
    }

    .markdown-section .mermaid svg {
      height: auto;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="access-gate" id="access-gate">
    <form class="access-panel" id="access-form">
      <h1>访问验证</h1>
      <p>请输入访问码后继续查看文档。(门锁密码)</p>
      <div class="access-field">
        <label for="access-code">访问码</label>
        <input id="access-code" name="access-code" type="password" autocomplete="current-password" autofocus>
      </div>
      <button class="access-submit" type="submit">进入文档</button>
      <div class="access-error" id="access-error" aria-live="polite"></div>
    </form>
  </div>
  <div id="app">Loading...</div>
  <script>
    document.documentElement.dataset.authenticated = 'false';

    function escapeMermaidCode(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    var mermaidThemeVariables = {
      background: '#ffffff',
      mainBkg: '#f7f7f8',
      secondBkg: '#e6f4ef',
      tertiaryColor: '#ffffff',
      primaryColor: '#f7f7f8',
      primaryBorderColor: '#10a37f',
      primaryTextColor: '#202123',
      secondaryColor: '#e6f4ef',
      secondaryBorderColor: '#74aa9c',
      secondaryTextColor: '#202123',
      tertiaryBorderColor: '#d9d9e3',
      tertiaryTextColor: '#202123',
      lineColor: '#10a37f',
      textColor: '#202123',
      fontFamily: 'ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
      clusterBkg: '#f7f7f8',
      clusterBorder: '#d9d9e3',
      edgeLabelBackground: '#ffffff',
      noteBkg: '#fff7d6',
      noteBorderColor: '#f3c969',
      noteTextColor: '#202123',
      actorBkg: '#f7f7f8',
      actorBorder: '#10a37f',
      actorTextColor: '#202123',
      actorLineColor: '#d9d9e3',
      signalColor: '#0f8f70',
      signalTextColor: '#202123',
      labelBoxBkgColor: '#f7f7f8',
      labelBoxBorderColor: '#d9d9e3',
      labelTextColor: '#202123',
      loopTextColor: '#202123',
      activationBkgColor: '#e6f4ef',
      activationBorderColor: '#10a37f',
      pie1: '#10a37f',
      pie2: '#74aa9c',
      pie3: '#d9d9e3',
      pie4: '#202123',
      pie5: '#8e8ea0',
      pie6: '#ececf1'
    };

    window.$docsify = {
      name: 'Carbon Architecture',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      executeScript: true,
      markdown: {
        renderer: {
          code: function (code, lang) {
            var language = (lang || '').toLowerCase();

            if (language === 'mermaid' && window.mermaid) {
              return '<div class="mermaid">' + escapeMermaidCode(code) + '</div>';
            }

            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function (hook) {
          var isMermaidInitialized = false;

          function initializeMermaid() {
            if (!window.mermaid || isMermaidInitialized) {
              return;
            }

            window.mermaid.initialize({
              startOnLoad: false,
              securityLevel: 'strict',
              theme: 'base',
              themeVariables: mermaidThemeVariables
            });
            isMermaidInitialized = true;
          }

          hook.ready(initializeMermaid);

          hook.doneEach(function () {
            initializeMermaid();

            if (!window.mermaid) {
              return;
            }

            window.mermaid.run({
              querySelector: '.mermaid:not([data-processed="true"])'
            }).catch(function (error) {
              console.error('Mermaid render failed:', error);
            });
          });
        }
      ],
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs',
        noData: 'No results',
        depth: 4,
        hideOtherSidebarContent: false
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>
  <script>
    (function () {
      var accessHash = 'fe91a760983d401d9b679fb092b689488d1f46d92f3af5e9e93363326f3e8aa4';
      var sessionKey = 'carbon_arch_docs_access';
      var mermaidScript = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
      var scripts = [
        'https://cdn.jsdelivr.net/npm/docsify@4',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-jsx.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-tsx.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js',
        'https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js',
        'https://cdn.jsdelivr.net/npm/docsify-copy-code@2'
      ];
      var gate = document.getElementById('access-gate');
      var form = document.getElementById('access-form');
      var input = document.getElementById('access-code');
      var error = document.getElementById('access-error');

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }

      function loadScripts(scriptList) {
        return scriptList.reduce(function (chain, src) {
          return chain.then(function () {
            return loadScript(src);
          });
        }, Promise.resolve());
      }

      function loadDocsify() {
        loadScript(mermaidScript).catch(function () {
          window.mermaid = null;
        }).then(function () {
          return loadScripts(scripts);
        }).catch(function () {
          error.textContent = '文档资源加载失败，请稍后重试。';
        });
      }

      function unlock() {
        sessionStorage.setItem(sessionKey, accessHash);
        document.documentElement.dataset.authenticated = 'true';
        gate.hidden = true;
        loadDocsify();
      }

      function toHex(buffer) {
        return Array.prototype.map.call(new Uint8Array(buffer), function (byte) {
          return byte.toString(16).padStart(2, '0');
        }).join('');
      }

      function sha256(value) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(value)).then(toHex);
      }

      if (sessionStorage.getItem(sessionKey) === accessHash) {
        unlock();
        return;
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        error.textContent = '';

        sha256(input.value).then(function (hash) {
          if (hash === accessHash) {
            unlock();
            return;
          }

          input.value = '';
          input.focus();
          error.textContent = '访问码不正确。';
        }).catch(function () {
          error.textContent = '当前浏览器不支持访问验证。';
        });
      });
    }());
  </script>
</body>
</html>
